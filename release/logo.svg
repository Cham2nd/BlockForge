<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#3a2a1c"/>
      <stop offset="1" stop-color="#120d09"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d949e"/>
      <stop offset="1" stop-color="#3c4148"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#c8891e"/>
    </linearGradient>
  </defs>

  <!-- fond et cadre dore -->
  <rect x="8" y="8" width="384" height="384" rx="56" fill="url(#bg)" stroke="url(#gold)" stroke-width="10"/>

  <!-- blocs de macro qui tombent sur l'enclume -->
  <g stroke="#120d09" stroke-width="4">
    <rect x="96" y="62" width="208" height="34" rx="9" fill="#4a90e2"/>
    <rect x="118" y="104" width="164" height="34" rx="9" fill="#e2574a"/>
    <rect x="140" y="146" width="120" height="34" rx="9" fill="url(#gold)"/>
  </g>
  <g fill="#120d09" opacity="0.55">
    <rect x="110" y="75" width="60" height="8" rx="4"/>
    <rect x="132" y="117" width="44" height="8" rx="4"/>
    <rect x="154" y="159" width="34" height="8" rx="4"/>
  </g>

  <!-- etincelles -->
  <g stroke="#ffd36b" stroke-width="6" stroke-linecap="round">
    <path d="M92 190 l-22 -14"/>
    <path d="M308 190 l22 -14"/>
    <path d="M66 168 l-14 -22"/>
    <path d="M334 168 l14 -22"/>
  </g>

  <!-- enclume -->
  <g fill="url(#steel)" stroke="#120d09" stroke-width="5" stroke-linejoin="round">
    <path d="M70 200 h230 q34 0 44 22 q-40 4 -62 28 h-42 v34 h36 v40 h-152 v-40 h36 v-34 h-40 q-18 -30 -50 -50 z"/>
  </g>
  <path d="M84 208 h206" stroke="#c9cfd8" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
</svg>
